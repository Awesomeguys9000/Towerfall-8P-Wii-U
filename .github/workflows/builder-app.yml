# Builds the standalone TowerFall 8P Builder app (Python bundled) for Windows, macOS and Linux.
# Every run uploads the zips as workflow artifacts; pushing a tag like v1.0 also attaches them to a release.
name: Builder app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-14        # Apple Silicon
          - os: macos-15-intel  # Intel Macs
          - os: ubuntu-22.04    # older glibc, so the binary runs on more distros
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tk libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tk-dev
      - run: pip install pyinstaller certifi
      - name: Import Developer ID certificate (macOS, when the secrets are set)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          [ -n "$MACOS_CERT_P12" ] || { echo "no certificate secret: building unsigned"; exit 0; }
          kc="$RUNNER_TEMP/sign.keychain-db"; kp="$(uuidgen)"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kp" "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          id=$(security find-identity -v -p codesigning "$kc" | grep -o '"Developer ID Application[^"]*"' | head -1 | tr -d '"')
          echo "MACOS_SIGN_IDENTITY=$id" >> "$GITHUB_ENV"
      - run: python builder/build_app.py
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      - name: Smoke test (no window)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then exe="builder/dist/TowerFall 8P Builder.app/Contents/MacOS/TowerFall 8P Builder";
          elif [ "$RUNNER_OS" = Windows ]; then exe="builder/dist/TowerFall 8P Builder.exe";
          else exe=builder/dist/towerfall-8p-builder; fi
          echo 'import pipeline as P; print([r["name"] for r in P.check_tools()]); print("ok")' > smoke.py
          "$exe" --py smoke.py | tee out.txt
          grep -q ok out.txt
      - uses: actions/upload-artifact@v4
        with:
          name: builder-${{ matrix.os }}
          path: builder/dist/*.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: builder/dist/*.zip
